# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: zava
metadata:
  template: zava@0.0.1
services:
  api:
    project: ./src/Zava.Api
    host: containerapp
    language: dotnet
    docker:
      path: ./src/Zava.Api/Dockerfile
      context: .
  web:
    project: ./src/Zava.Web
    host: containerapp
    language: ts
    docker:
      path: ./src/Zava.Web/Dockerfile
      context: ./src/Zava.Web
hooks:
  postprovision:
    shell: sh
    run: python3 ./scripts/deploy-recipe-agents.py
    interactive: false
    continueOnError: false
  postdeploy:
    shell: sh
    run: python3 ./scripts/deploy-recipe-agents.py --smoke
    interactive: false
    continueOnError: false
