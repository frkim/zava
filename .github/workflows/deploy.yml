name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: zava-production-deployment
  cancel-in-progress: false

env:
  AZURE_ENV_NAME: zava-prod
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  # Left empty on purpose: main.parameters.json then falls back to AZURE_LOCATION.
  AZURE_AI_LOCATION: ${{ vars.AZURE_AI_LOCATION }}
  AZURE_AI_MODEL_NAME: ${{ vars.AZURE_AI_MODEL_NAME || 'gpt-5-mini' }}
  AZURE_AI_MODEL_VERSION: ${{ vars.AZURE_AI_MODEL_VERSION || '2025-08-07' }}
  AZURE_AI_MODEL_SKU: ${{ vars.AZURE_AI_MODEL_SKU || 'GlobalStandard' }}
  AZURE_AI_MODEL_CAPACITY: ${{ vars.AZURE_AI_MODEL_CAPACITY || '10' }}
  # Native Foundry traces can contain prompts and responses; explicitly opt in.
  AZURE_AI_ENABLE_TRACING: ${{ vars.AZURE_AI_ENABLE_TRACING || 'false' }}
  AZURE_PRINCIPAL_TYPE: ServicePrincipal
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Validate infrastructure and agent definitions
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          python3 scripts/deploy-recipe-agents.py --check
          python3 -m unittest discover -s tests/deployment -v

      - name: Build deployment images before provisioning
        run: |
          docker build --file src/Zava.Api/Dockerfile --tag zava-api:preflight .
          docker build --file src/Zava.Web/Dockerfile --tag zava-web:preflight src/Zava.Web

      # A client secret in AZURE_CREDENTIALS is authoritative: it carries the
      # tenant and subscription the deployment must target.
      - name: Log in with Azure (Client Secret)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        run: |
          $info = $env:AZURE_CREDENTIALS | ConvertFrom-Json
          azd auth login `
            --client-id $info.clientId `
            --client-secret $info.clientSecret `
            --tenant-id $info.tenantId
          "AZURE_TENANT_ID=$($info.tenantId)" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($info.subscriptionId) {
            "AZURE_SUBSCRIPTION_ID=$($info.subscriptionId)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
        shell: pwsh
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CREDENTIALS == '' && env.AZURE_CLIENT_ID != '' }}
        run: |
          azd auth login `
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" `
            --federated-credential-provider "github" `
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      # postprovision deploys both Foundry agents; a failure prevents image deployment.
      - name: Provision infrastructure and deploy Foundry agents
        run: azd provision --no-prompt

      - name: Deploy application images and run read-only smoke checks
        run: azd deploy --no-prompt
